name: Quality

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  public-suite:
    name: Public quality suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install --disable-pip-version-check -r requirements-quality.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm run quality:public

  protected-suite:
    name: Protected data suite (same-repository PRs only)
    needs: public-suite
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VISAGIO_DATA_PASSWORD: ${{ secrets.VISAGIO_DATA_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install --disable-pip-version-check -r requirements-quality.txt
      - name: Exigir credencial dos dados protegidos
        if: env.VISAGIO_DATA_PASSWORD == ''
        run: |
          echo 'PROTECTED_SUITE_BLOCKED: configure o secret VISAGIO_DATA_PASSWORD.'
          exit 1
      - run: python -m playwright install --with-deps chromium
      - run: npm test
