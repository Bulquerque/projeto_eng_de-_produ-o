name: Quality

on:
  workflow_dispatch:
  push:
    branches: [main, 'fix/**']
  pull_request:

permissions:
  contents: read

jobs:
  public-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Instalar utilitário de leitura do PDF
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: npm ci
      - run: python -m pip install -r requirements-dev.txt
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:public

  protected-audit-round-1:
    needs: public-suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VISAGIO_DATA_PASSWORD: ${{ secrets.VISAGIO_DATA_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Instalar utilitário de leitura do PDF
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: npm ci
      - run: python -m pip install -r requirements-dev.txt
      - name: Exigir credencial dos dados protegidos
        if: env.VISAGIO_DATA_PASSWORD == ''
        run: |
          echo 'PROTECTED_AUDIT_BLOCKED — secret VISAGIO_DATA_PASSWORD não configurado.'
          exit 1
      - run: python -m playwright install --with-deps chromium
      - name: Executar auditoria protegida 1
        run: |
          mkdir -p audit-logs
          set -o pipefail
          echo 'AUDIT_ROUND_1_START' | tee audit-logs/round-1.log
          npm test 2>&1 | tee -a audit-logs/round-1.log
          echo 'AUDIT_ROUND_1_CLEAN' | tee -a audit-logs/round-1.log
      - name: Publicar evidências da auditoria 1
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: visagio-audit-round-1
          path: |
            audit-logs/round-1.log
            data/validation/prova_bala_evidence/
          if-no-files-found: error
          retention-days: 30

  protected-audit-round-2:
    needs: protected-audit-round-1
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VISAGIO_DATA_PASSWORD: ${{ secrets.VISAGIO_DATA_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: npm ci
      - run: python -m pip install -r requirements-dev.txt
      - name: Exigir credencial dos dados protegidos
        if: env.VISAGIO_DATA_PASSWORD == ''
        run: |
          echo 'PROTECTED_AUDIT_BLOCKED — secret VISAGIO_DATA_PASSWORD não configurado.'
          exit 1
      - run: python -m playwright install --with-deps chromium
      - name: Executar auditoria protegida 2 em ambiente novo
        run: |
          mkdir -p audit-logs
          set -o pipefail
          echo 'AUDIT_ROUND_2_START' | tee audit-logs/round-2.log
          npm test 2>&1 | tee -a audit-logs/round-2.log
          echo 'AUDIT_ROUND_2_CLEAN' | tee -a audit-logs/round-2.log
      - name: Publicar evidências da auditoria 2
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: visagio-audit-round-2
          path: |
            audit-logs/round-2.log
            data/validation/prova_bala_evidence/
          if-no-files-found: error
          retention-days: 30
