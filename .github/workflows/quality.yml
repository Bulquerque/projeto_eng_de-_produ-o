name: Quality

on:
  push:
    branches: [main, 'fix/**']
  pull_request:

jobs:
  public-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: npm ci
      - run: python -m pip install -r requirements-dev.txt
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:public

  protected-suite:
    runs-on: ubuntu-latest
    env:
      VISAGIO_DATA_PASSWORD: ${{ secrets.VISAGIO_DATA_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: npm ci
      - run: python -m pip install -r requirements-dev.txt
      - name: Instalar Chromium quando o segredo estiver disponível
        if: env.VISAGIO_DATA_PASSWORD != ''
        run: python -m playwright install --with-deps chromium
      - name: Executar suíte completa protegida
        if: env.VISAGIO_DATA_PASSWORD != ''
        run: npm test
      - name: Registrar bloqueio sem segredo
        if: env.VISAGIO_DATA_PASSWORD == ''
        run: echo 'PROTECTED_SUITE_BLOCKED — secret VISAGIO_DATA_PASSWORD não configurado; nenhum teste protegido foi aprovado.'
