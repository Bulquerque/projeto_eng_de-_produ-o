name: Quality

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  public-suite:
    name: Public quality suite
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install --disable-pip-version-check -r requirements-quality.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm run quality:public

  protected-suite:
    name: Protected data suite (same-repository PRs only)
    needs: public-suite
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VISAGIO_DATA_PASSWORD: ${{ secrets.VISAGIO_DATA_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install --disable-pip-version-check -r requirements-quality.txt
      - name: Exigir credencial dos dados protegidos
        if: env.VISAGIO_DATA_PASSWORD == ''
        run: |
          echo 'PROTECTED_SUITE_BLOCKED: configure o secret VISAGIO_DATA_PASSWORD.'
          exit 1
      - run: python -m playwright install --with-deps chromium
      - run: npm test
