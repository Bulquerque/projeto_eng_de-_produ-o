name: Quality

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  public-suite:
    name: Public quality suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install --disable-pip-version-check ruff
      - run: npm run lint
      - run: npm run format:check
      - run: ruff check .
      - run: ruff format --check .
      - run: npm run test:public

  protected-suite:
    name: Protected data suite
    needs: public-suite
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VISAGIO_DATA_PASSWORD: ${{ secrets.VISAGIO_DATA_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install --disable-pip-version-check playwright
      - name: Exigir credencial dos dados protegidos
        if: env.VISAGIO_DATA_PASSWORD == ''
        run: |
          echo 'PROTECTED_SUITE_BLOCKED: configure o secret VISAGIO_DATA_PASSWORD.'
          exit 1
      - run: python -m playwright install --with-deps chromium
      - run: npm test
